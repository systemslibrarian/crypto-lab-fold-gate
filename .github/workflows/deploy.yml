name: Build, verify, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Coverage thresholds (the README advertises these as a gate)
        run: npm run test:coverage
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility and claims gate
        run: npm run test:a11y
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Record what is being merged
        # Policy is deliberately "the gate decides, not the version number", so this
        # does not gate anything -- but the run log must say which update type was
        # auto-merged, or a major landing here leaves no trace of having been one.
        run: |
          echo "update-type: ${UPDATE_TYPE:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "dependencies: ${DEPS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
      - name: Merge any bump whose gate went green
        run: |
          for attempt in 1 2 3; do
            gh pr merge --squash --delete-branch "$PR_URL" && merged=1 && break
            sleep 15
          done
          if [ -z "$merged" ]; then
            state=$(gh pr view "$PR_URL" --json state --jq .state)
            if [ "$state" = "MERGED" ]; then
              merged=1
            else
              echo "::error::gate passed but the merge did not land after 3 attempts (PR state: $state)"
              exit 1
            fi
          fi
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}